version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen individual bumps.
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Action bumps arrive together and are almost always safe as a set.
      # Ungrouped, a routine month opens five near-identical PRs.
      actions:
        patterns:
          - "*"
